name: TurboTape
options:
  bundleIdPrefix: com.manu
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  TurboTapeKit:
    path: .
targets:
  TurboTape:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TurboTapeKit
        product: TurboTapeKit
    entitlements:
      path: App/TurboTape.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.assets.movies.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manu.turbotape
        PRODUCT_NAME: TurboTape
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TurboTape
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
schemes:
  TurboTape:
    build:
      targets:
        TurboTape: all
    run:
      config: Debug
    archive:
      config: Release
